
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lupa Password - ALL STORE</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0d0d0d;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.box{
width:350px;
max-width:100%;
background:#171717;
padding:25px;
border-radius:15px;
box-shadow:0 0 15px rgba(0,174,255,.3);
}

.logo{
text-align:center;
font-size:28px;
font-weight:bold;
color:#00aeff;
margin-bottom:10px;
}

.sub{
text-align:center;
color:#999;
margin-bottom:20px;
font-size:14px;
line-height:1.6;
}

input{
width:100%;
padding:12px;
margin-bottom:15px;
border:none;
border-radius:8px;
background:#252525;
color:#fff;
outline:none;
}

input:focus{
box-shadow:0 0 0 1px #00aeff;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:8px;
background:#00aeff;
color:#fff;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

button:disabled{
opacity:.6;
cursor:not-allowed;
}

.link{
margin-top:18px;
text-align:center;
}

.link a{
color:#00aeff;
text-decoration:none;
font-size:14px;
}

#pesan{
display:none;
margin-top:15px;
padding:12px;
border-radius:8px;
font-size:13px;
line-height:1.5;
overflow-wrap:anywhere;
}
</style>
</head>

<body>

<div class="box">

<div class="logo">ALL STORE</div>

<div class="sub">
Masukkan email akun Anda. Kami akan mengirimkan tautan untuk mengatur ulang password.
</div>

<form id="resetForm">

<input
type="email"
id="email"
placeholder="Masukkan email akun"
required
>

<button type="submit" id="kirimBtn">
Kirim Link Pemulihan
</button>

</form>

<div id="pesan"></div>

<div class="link">
<a href="allstore-login-register.html">← Kembali ke Login</a>
</div>

</div>

<script>
const API_BASE = "https://api.allstoreid.my.id";

const form = document.getElementById("resetForm");
const tombol = document.getElementById("kirimBtn");
const pesan = document.getElementById("pesan");

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const email = document.getElementById("email").value.trim();

  tombol.disabled = true;
  tombol.textContent = "Mengirim...";
  pesan.style.display = "none";

  try {
    const response = await fetch(API_BASE + "/auth/forgot-password", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ email })
    });

    const result = await response.json();

    if (!response.ok || !result.success) {
      throw new Error(result.message || "Gagal mengirim permintaan.");
    }

    pesan.style.display = "block";
    pesan.style.background = "#12351f";
    pesan.style.color = "#8dffad";
    pesan.textContent =
      "Jika email terdaftar dan terverifikasi, link pemulihan akan dikirim. Periksa kotak masuk dan folder spam.";

  } catch (error) {
    pesan.style.display = "block";
    pesan.style.background = "#401b1b";
    pesan.style.color = "#ffaaaa";
    pesan.textContent =
      error.message || "Terjadi kesalahan. Silakan coba lagi.";
  } finally {
    tombol.disabled = false;
    tombol.textContent = "Kirim Link Pemulihan";
  }
});
</script>

</body>
</html>
