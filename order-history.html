<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Riwayat Pesanan - ALL STORE</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#080d18;
  color:#f1f5f9;
  font-family:Arial,sans-serif;
}
header{
  padding:20px;
  background:#101a2c;
  border-bottom:1px solid #24334b;
  display:flex;
  align-items:center;
  gap:14px;
}
.back{
  color:#60a5fa;
  text-decoration:none;
  font-size:22px;
}
header h2{margin:0;font-size:19px}
.container{
  max-width:650px;
  margin:auto;
  padding:18px;
}
.filters{
  display:flex;
  gap:8px;
  overflow-x:auto;
  margin-bottom:18px;
}
.filter{
  border:1px solid #263750;
  background:#111c30;
  color:#cbd5e1;
  padding:10px 15px;
  border-radius:20px;
  white-space:nowrap;
  cursor:pointer;
}
.filter.active{
  background:#2563eb;
  border-color:#2563eb;
  color:white;
}
.card{
  background:#111c30;
  border:1px solid #263750;
  border-radius:13px;
  padding:15px;
  margin-bottom:12px;
}
.top{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
}
.category{
  font-size:12px;
  color:#60a5fa;
  text-transform:uppercase;
  font-weight:bold;
}
.status{
  font-size:12px;
  padding:5px 9px;
  border-radius:20px;
  background:#334155;
  color:#e2e8f0;
}
.status.success{background:#14532d;color:#86efac}
.status.failed{background:#7f1d1d;color:#fecaca}
.status.pending{background:#713f12;color:#fde68a}
.product{
  font-size:16px;
  font-weight:bold;
  margin:13px 0 8px;
}
.detail{
  color:#94a3b8;
  font-size:13px;
  margin:6px 0;
  overflow-wrap:anywhere;
}
.amount{
  font-size:17px;
  font-weight:bold;
  margin-top:12px;
  color:#f8fafc;
}
.empty{
  text-align:center;
  color:#94a3b8;
  padding:45px 15px;
  background:#111c30;
  border-radius:13px;
}
.loading{text-align:center;color:#94a3b8;padding:35px}
</style>
</head>

<body>
<header>
  <a class="back" href="profile.html">←</a>
  <h2>Riwayat Pesanan</h2>
</header>

<main class="container">
  <div class="filters">
    <button class="filter active" data-filter="all">Semua</button>
    <button class="filter" data-filter="phone">Pulsa / Data</button>
    <button class="filter" data-filter="game">Game</button>
    <button class="filter" data-filter="postpaid">Pascabayar</button>
  </div>

  <div id="history" class="loading">Memuat riwayat pesanan...</div>
</main>

<script>
const API = "https://api.allstoreid.my.id/orders/history";
const historyBox = document.getElementById("history");

let allOrders = [];
let activeFilter = "all";

function rupiah(value){
  return "Rp " + Number(value || 0).toLocaleString("id-ID");
}

function dateFormat(value){
  if(!value) return "-";
  const date = new Date(value);
  if(isNaN(date.getTime())) return value;

  return date.toLocaleString("id-ID",{
    day:"2-digit",
    month:"short",
    year:"numeric",
    hour:"2-digit",
    minute:"2-digit"
  });
}

function categoryName(category){
  return {
    phone:"Pulsa / Data",
    game:"Game",
    postpaid:"Pascabayar"
  }[category] || category;
}

function statusInfo(status){
  const value = String(status || "unknown").toLowerCase();

  if(["success","sukses","succeeded","completed"].includes(value)){
    return ["Berhasil","success"];
  }

  if(["failed","gagal","error","cancelled","canceled"].includes(value)){
    return ["Gagal","failed"];
  }

  if(["pending","processing","waiting","queued"].includes(value)){
    return ["Diproses","pending"];
  }

  return [status || "Belum diketahui",""];
}

function renderOrders(){
  const filtered = activeFilter === "all"
    ? allOrders
    : allOrders.filter(item => item.category === activeFilter);

  if(!filtered.length){
    historyBox.innerHTML =
      '<div class="empty">Belum ada riwayat pesanan.</div>';
    return;
  }

  historyBox.innerHTML = filtered.map(item => {
    const [statusLabel,statusClass] = statusInfo(item.status);

    return `
      <div class="card">
        <div class="top">
          <span class="category">${categoryName(item.category)}</span>
          <span class="status ${statusClass}">${statusLabel}</span>
        </div>

        <div class="product">${escapeHTML(item.title || "-")}</div>

        <div class="detail">
          ID Pesanan: ${escapeHTML(item.id || "-")}
        </div>

        <div class="detail">
          Tujuan: ${escapeHTML(item.target || "-")}
        </div>

        <div class="detail">
          Waktu: ${escapeHTML(dateFormat(item.created_at))}
        </div>

        <div class="amount">${rupiah(item.amount)}</div>
      </div>
    `;
  }).join("");
}

function escapeHTML(value){
  return String(value).replace(/[&<>"']/g, char => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  })[char]);
}

document.querySelectorAll(".filter").forEach(button => {
  button.addEventListener("click",() => {
    document.querySelectorAll(".filter").forEach(item =>
      item.classList.remove("active")
    );

    button.classList.add("active");
    activeFilter = button.dataset.filter;
    renderOrders();
  });
});

async function loadHistory(){
  const token = sessionStorage.getItem("allstore_token");

  if(!token){
    location.href = "allstore-login-register.html";
    return;
  }

  try{
    const response = await fetch(API,{
      method:"GET",
      headers:{
        "Authorization":"Bearer " + token
      }
    });

    const data = await response.json();

    if(response.status === 401){
      sessionStorage.removeItem("allstore_token");
      sessionStorage.removeItem("allstore_user");
      location.href = "allstore-login-register.html";
      return;
    }

    if(!response.ok || !data.success){
      throw new Error(data.message || "Gagal mengambil riwayat");
    }

    allOrders = Array.isArray(data.history) ? data.history : [];
    renderOrders();

  }catch(error){
    console.error(error);
    historyBox.innerHTML =
      '<div class="empty">Gagal memuat riwayat pesanan. Coba muat ulang halaman.</div>';
  }
}

loadHistory();
</script>
</body>
</html>
