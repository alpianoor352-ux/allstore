
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - ALL STORE</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0f172a;
      color: white;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 380px;
      background: #1e293b;
      padding: 28px;
      border-radius: 14px;
    }
    h2 { text-align: center; margin-top: 0; }
    input, button {
      width: 100%;
      padding: 13px;
      margin-top: 14px;
      border-radius: 8px;
      font-size: 15px;
    }
    input {
      border: 1px solid #475569;
      background: #0f172a;
      color: white;
    }
    button {
      border: none;
      background: #2563eb;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    #message {
      font-size: 14px;
      text-align: center;
      margin-top: 15px;
      line-height: 1.5;
    }
    a { color: #60a5fa; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Password Baru</h2>

    <form id="resetForm">
      <input
        type="password"
        id="password"
        placeholder="Masukkan password baru"
        minlength="6"
        required
      >

      <input
        type="password"
        id="confirmPassword"
        placeholder="Ulangi password baru"
        minlength="6"
        required
      >

      <button type="submit" id="submitBtn">Simpan Password</button>
    </form>

    <p id="message"></p>
  </div>

  <script>
    const supabase = window.supabase.createClient(
      "https://sxfmmmfebcepvlwzelbi.supabase.co",
      "GANTI_DENGAN_ANON_KEY_DARI_LOGIN_HTML"
    );

    const form = document.getElementById("resetForm");
    const message = document.getElementById("message");
    const submitBtn = document.getElementById("submitBtn");

    let recoveryReady = false;

    supabase.auth.onAuthStateChange((event, session) => {
      if (event === "PASSWORD_RECOVERY" && session) {
        recoveryReady = true;
        message.textContent = "Silakan masukkan password baru.";
      }
    });

    async function checkSession() {
      const { data, error } = await supabase.auth.getSession();

      if (error || !data.session) {
        message.textContent =
          "Tautan pemulihan tidak valid atau sudah kedaluwarsa. Silakan minta tautan baru.";
        form.style.display = "none";
        return;
      }

      recoveryReady = true;
      message.textContent = "Silakan masukkan password baru.";
    }

    checkSession();

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      if (!recoveryReady) {
        message.textContent = "Sesi pemulihan belum tersedia. Coba buka ulang tautan dari email.";
        return;
      }

      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if (password.length < 6) {
        message.textContent = "Password minimal 6 karakter.";
        return;
      }

      if (password !== confirmPassword) {
        message.textContent = "Konfirmasi password tidak cocok.";
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Menyimpan...";

      const { error } = await supabase.auth.updateUser({
        password: password
      });

      if (error) {
        message.textContent = "Gagal mengubah password: " + error.message;
        submitBtn.disabled = false;
        submitBtn.textContent = "Simpan Password";
        return;
      }

      await supabase.auth.signOut();

      message.innerHTML =
        'Password berhasil diubah. Silakan <a href="login.html">login kembali</a>.';

      form.style.display = "none";
    });
  </script>
</body>
  </html>
