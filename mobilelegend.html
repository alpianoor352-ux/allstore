<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title> Mobile Legends - ALL STORE</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0d0d0d;
color:white;
}

.navbar{
background:#111;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:2px solid #00aeff;
box-shadow:0 0 15px #00aeff33;
}

.logo{
font-size:26px;
font-weight:bold;
color:#00aeff;
}

.back{
text-decoration:none;
background:#00aeff;
color:white;
padding:10px 18px;
border-radius:10px;
font-weight:bold;
}

.banner{
width:100%;
height:220px;
overflow:hidden;
}

.banner img{
width:100%;
height:100%;
object-fit:cover;
}

.container{
max-width:700px;
margin:20px auto;
padding:15px;
}

.card{
background:#181818;
border:2px solid #00aeff;
border-radius:15px;
padding:20px;
box-shadow:0 0 15px #00aeff22;
}

label{
display:block;
margin-top:15px;
margin-bottom:8px;
font-weight:bold;
color:#00aeff;
}

input,select{
width:100%;
padding:12px;
background:#222;
color:white;
border:2px solid #333;
border-radius:10px;
outline:none;
font-size:15px;
margin-bottom:10px;
}

input:focus,
select:focus{
border-color:#00aeff;
box-shadow:0 0 10px #00aeff55;
}

#hargaTotal{
margin-top:15px;
padding:15px;
background:#111;
border:2px solid #00aeff;
border-radius:10px;
font-size:18px;
font-weight:bold;
color:#00ff88;
text-align:center;
}

button{
width:100%;
padding:15px;
margin-top:20px;
background:#00aeff;
color:white;
font-size:18px;
font-weight:bold;
border:none;
border-radius:10px;
cursor:pointer;
transition:.3s;
}

button:hover{
background:#0090d4;
}

.ringkasan{
margin-top:20px;
padding:15px;
background:#111;
border:2px solid #00aeff;
border-radius:10px;
}

.ringkasan h3{
text-align:center;
color:#00aeff;
margin-bottom:10px;
}

.ringkasan p{
margin:8px 0;
}

.peringatan{
position:relative;
background:#2b1b00;
border:2px solid #ffb300;
color:#ffd54f;
padding:15px;
border-radius:10px;
margin-top:20px;
line-height:1.6;
}

.close{
position:absolute;
top:10px;
right:15px;
font-size:22px;
cursor:pointer;
font-weight:bold;
color:white;
}

.close:hover{
color:red;
}

.judul{
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:8px;
font-size:24px;
font-weight:bold;
color:#00aeff;
text-align:center;
margin-bottom:20px;
}

.judul img{
width:65px;
height:65px;
object-fit:contain;
border-radius:10px;
}

</style>

</head>

<body>

<div class="navbar">

<a href="topupgame.html" class="back">⬅ Kembali</a>

</div>

<div class="container">

<div class="card">

<div class="judul">
  <img src="https://i.ibb.co.com/spzvrrVY/1782832595297.jpg" alt="Free Fire">
  <span>Mobile Legends</span>
</div>

<label>🆔 User ID</label>
<input type="text" id="uid" placeholder="Masukkan User ID">

<label>🌍 Server (Opsional)</label>
<input type="text" id="server" placeholder="Masukkan Server">
  
<label>💎 Pilih Produk</label>
<select id="produk">
<option value="">-- Pilih Produk --</option>
</select>

<label>💳 Metode Pembayaran</label>
<select id="payment">
<option>DANA</option>
<option>GoPay</option>
<option>OVO</option>
<option>ShopeePay</option>
<option>QRIS</option>
</select>

<div id="hargaTotal">
💰 Total Harga: Rp0
</div>

<button id="pesanBtn">
🟢 Pesan Sekarang
</button>

<div class="ringkasan">

<h3>📋 Ringkasan Pesanan</h3>

<p id="ringProduk">💎 Produk : -</p>

<p id="ringHarga">💰 Harga : Rp0</p>

</div>

<div id="peringatan" class="peringatan">

<span class="close" onclick="tutupPeringatan()">&times;</span>

<b>⚠️ PERHATIAN!</b><br><br>

• Pastikan User ID dan Server sudah benar.<br>
• Kesalahan pengisian data bukan tanggung jawab Admin ALL STORE.<br>
• Pesanan yang sudah diproses tidak dapat dibatalkan atau direfund.

</div>

</div>

</div>

<script>

const URL_API_GAME = "https://api.allstoreid.my.id/digiflazz/game-products";
const produk = document.getElementById("produk");
let daftarProduk = [];
let produkBySku = new Map();

// Harga jual: margin 15% atau minimal Rp1.000, lalu dibulatkan ke atas
// ke kelipatan Rp500 agar harga mudah dibaca.
function hitungHargaJual(hargaModal) {
  const hargaDenganMargin = Math.max(hargaModal * 1.15, hargaModal + 1000);
  return Math.ceil(hargaDenganMargin / 500) * 500;
}

function formatRupiah(angka) {
  return Number(angka).toLocaleString("id-ID");
}

async function muatProduk() {
  produk.innerHTML = '<option value="">Memuat produk Mobile Legends...</option>';

  try {
    const response = await fetch(URL_API_GAME);
    if (!response.ok) throw new Error("Server API merespons " + response.status);

    const hasil = await response.json();
    if (!hasil.success || !Array.isArray(hasil.data)) {
      throw new Error("Format data produk tidak sesuai");
    }

    daftarProduk = hasil.data
      .filter(item => String(item.brand || "").toUpperCase().includes("MOBILE LEGENDS"))
      .map(item => ({
        nama: item.product_name,
        sku: item.buyer_sku_code,
        hargaModal: Number(item.price),
        harga: hitungHargaJual(Number(item.price))
      }))
      .filter(item => item.nama && item.sku && Number.isFinite(item.hargaModal));

    produkBySku = new Map(daftarProduk.map(item => [item.sku, item]));
    produk.innerHTML = '<option value="">-- Pilih Produk --</option>';

    if (daftarProduk.length === 0) {
      produk.innerHTML = '<option value="">Produk Mobile Legends belum tersedia</option>';
      return;
    }

    daftarProduk.forEach(item => {
      const option = document.createElement("option");
      option.value = item.sku;
      option.textContent = `${item.nama} - Rp${formatRupiah(item.harga)}`;
      produk.appendChild(option);
    });
  } catch (error) {
    console.error("Gagal memuat produk game:", error);
    produk.innerHTML = '<option value="">Produk gagal dimuat — muat ulang halaman</option>';
    alert("Produk Mobile Legends gagal dimuat. Periksa koneksi internet lalu muat ulang halaman.");
  }
}

produk.addEventListener("change", function() {
  const item = produkBySku.get(this.value);
  const nama = item ? item.nama : "-";
  const harga = item ? item.harga : 0;

  document.getElementById("hargaTotal").textContent =
    "💰 Total Harga: Rp" + formatRupiah(harga);
  document.getElementById("ringProduk").textContent = "💎 Produk : " + nama;
  document.getElementById("ringHarga").textContent = "💰 Harga : Rp" + formatRupiah(harga);
});

muatProduk();

document.getElementById("pesanBtn").addEventListener("click", function(){

let uid=document.getElementById("uid").value;
let server=document.getElementById("server").value;
let pembayaran=document.getElementById("payment").value;

if(uid==""){
alert("Masukkan User ID!");
return;
}

if(produk.value===""){
alert("Pilih produk terlebih dahulu!");
return;
}

const itemDipilih = produkBySku.get(produk.value);
if (!itemDipilih) {
alert("Data produk belum siap. Muat ulang halaman lalu coba lagi.");
return;
}

let pesan=`Halo Admin ALL STORE

Saya ingin Top Up Mobile Legends.

🆔 UID : ${uid}
🌍 Server : ${server}

💎 Produk : ${itemDipilih.nama}
🧾 Kode Produk : ${itemDipilih.sku}

💰 Harga : Rp${formatRupiah(itemDipilih.harga)}

💳 Pembayaran : ${pembayaran}

Terima kasih.`;

window.open(
"https://wa.me/6281545462473?text="+encodeURIComponent(pesan)
);

});

function tutupPeringatan(){
document.getElementById("peringatan").style.display="none";
}

</script>

</body>

</html>
