<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar - ALL STORE</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0d0d0d;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
width:350px;
background:#171717;
padding:25px;
border-radius:15px;
box-shadow:0 0 15px rgba(0,174,255,.3);
}

.logo{
text-align:center;
font-size:28px;
font-weight:bold;
color:#00aeff;
margin-bottom:5px;
}

.sub{
text-align:center;
color:#999;
margin-bottom:20px;
font-size:14px;
}

input{
width:100%;
padding:12px;
margin-bottom:15px;
border:none;
border-radius:8px;
background:#252525;
color:#fff;
outline:none;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:8px;
background:#00aeff;
color:#fff;
font-size:16px;
cursor:pointer;
font-weight:bold;
}

button:hover{
background:#0095dd;
}

.login{
text-align:center;
margin-top:15px;
color:#aaa;
}

.login a{
color:#00aeff;
text-decoration:none;
}
</style>

</head>
<body>

<div class="box">

<div class="logo">
ALL STORE
</div>

<div class="sub">
Buat akun baru
</div>

<form id="registerForm">

<input
type="text"
id="username"
placeholder="Username"
required>

<input
type="email"
id="email"
placeholder="Email"
required>

<input
type="password"
id="password"
placeholder="Password"
required>

<input
type="password"
id="confirm"
placeholder="Konfirmasi Password"
required>

<button type="submit">
Daftar
</button>

</form>

<div class="login">
Sudah punya akun?
<a href="login.html">
Masuk
</a>
</div>

</div>

<script>
document.getElementById("registerForm").addEventListener("submit", async (e) => {

e.preventDefault();

const username = document.getElementById("username").value;
const email = document.getElementById("email").value;
const password = document.getElementById("password").value;
const confirm = document.getElementById("confirm").value;

if(password !== confirm){
alert("Password tidak sama!");
return;
}

const { data, error } = await supabase.auth.signUp({
email: email,
password: password
});

if(error){
alert(error.message);
return;
}

await supabase.from("users").insert({
id: data.user.id,
email: email,
username: username
});

alert("Registrasi berhasil! Silakan login.");
window.location.href="login.html";

});
</script>
