
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - ALL STORE</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0f172a;
      color: white;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 380px;
      background: #1e293b;
      padding: 28px;
      border-radius: 14px;
    }

    h2 { text-align: center; margin-top: 0; }

    input, button {
      width: 100%;
      padding: 13px;
      margin-top: 14px;
      border-radius: 8px;
      font-size: 15px;
    }

    input {
      border: 1px solid #475569;
      background: #0f172a;
      color: white;
    }

    button {
      border: none;
      background: #2563eb;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #message {
      font-size: 14px;
      text-align: center;
      margin-top: 15px;
      line-height: 1.5;
    }

    a { color: #60a5fa; }
  </style>
</head>

<body>
  <div class="container">
    <h2>Password Baru</h2>

    <form id="resetForm">
      <input
        type="password"
        id="password"
        placeholder="Masukkan password baru"
        minlength="8"
        maxlength="128"
        required
      >

      <input
        type="password"
        id="confirmPassword"
        placeholder="Ulangi password baru"
        minlength="8"
        maxlength="128"
        required
      >

      <button type="submit" id="submitBtn">
        Simpan Password
      </button>
    </form>

    <p id="message"></p>
  </div>

  <script>
    const API_BASE = "https://api.allstoreid.my.id";

    const form = document.getElementById("resetForm");
    const message = document.getElementById("message");
    const submitBtn = document.getElementById("submitBtn");

    const token = new URLSearchParams(window.location.search)
      .get("token");

    if (!token || !/^[a-f0-9]{64}$/i.test(token)) {
      message.textContent =
        "Tautan reset tidak valid. Silakan minta link pemulihan baru.";
      form.style.display = "none";
    } else {
      message.textContent = "Silakan masukkan password baru.";
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const password = document.getElementById("password").value;
      const confirmPassword =
        document.getElementById("confirmPassword").value;

      if (password.length < 8 || password.length > 128) {
        message.textContent =
          "Password harus 8–128 karakter.";
        return;
      }

      if (password !== confirmPassword) {
        message.textContent =
          "Konfirmasi password tidak cocok.";
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Menyimpan...";
      message.textContent = "";

      try {
        const response = await fetch(
          API_BASE + "/auth/reset-password",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              token: token,
              password: password
            })
          }
        );

        const result = await response.json();

        if (!response.ok || !result.success) {
          throw new Error(
            result.message || "Gagal mengubah password."
          );
        }

        form.style.display = "none";
        message.innerHTML =
          'Password berhasil diubah. Silakan <a href="allstore-login-register.html">login kembali</a>.';

      } catch (error) {
        message.textContent =
          error.message || "Terjadi kesalahan. Coba lagi.";
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Simpan Password";
      }
    });
  </script>
</body>
</html>
